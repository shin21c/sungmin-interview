<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="창원성민여자고등학교 2026년 성민소식지 모음"><title>성민소식지 | 창원성민여자고등학교</title><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#1f302d;background:#f4f7f6}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(135deg,#166c65,#2e9589);color:white;padding:38px 20px 42px;text-align:center}header .eyebrow{font-size:11px;letter-spacing:1.4px;opacity:.9}header h1{font-size:clamp(26px,5vw,38px);margin:12px 0 8px}header p{margin:0;opacity:.9;font-size:14px;line-height:1.6}main{max-width:850px;margin:-15px auto 60px;padding:0 16px}.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 30px #1a403017}h2{font-size:19px;margin:0 0 18px}.issue{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid #e1ece8;border-radius:14px;background:#fff;padding:12px;cursor:pointer;margin:10px 0;color:inherit;font:inherit}.issue:hover,.issue:focus-visible{border-color:#3caa9a;background:#f4fbf9}.issue .month{background:#e6f4ef;color:#136a5c;min-width:66px;padding:12px 8px;border-radius:12px;text-align:center;font-weight:750}.thumb{width:56px;height:74px;object-fit:cover;object-position:top;border-radius:5px;border:1px solid #e1ece8}.meta{flex:1;min-width:0}.meta b{display:block;font-size:17px;margin-bottom:5px}.meta small{display:block;color:#526a63;font-size:13px;line-height:1.5}.arrow{font-size:22px;color:#348d7f}.back{border:0;background:#e7f4f1;border-radius:11px;color:#17675e;padding:12px 16px;cursor:pointer;font-weight:700}.sub{color:#617570;font-size:13px;margin:6px 0 20px;line-height:1.7}.doc{margin:15px 0;box-shadow:0 5px 18px #00000013;border:1px solid #e6eeea;border-radius:8px;overflow:hidden;background:white}.doc img{display:block;width:100%;height:auto;cursor:zoom-in}.doc figcaption{padding:8px;text-align:center;font-size:12px;color:#5b716d;background:#f8faf9}.notice{font-size:12px;color:#5e716d;line-height:1.7;margin:22px 0}footer{text-align:center;font-size:12px;color:#788b85;padding:16px}.hidden{display:none}a{color:#176c60}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.minor{font-size:12px;color:#647d76}.pages{margin-top:12px}#viewer h2{margin-top:20px}#overlay{display:none;position:fixed;inset:0;z-index:10;background:#101715ec;overflow:auto;padding:45px 10px 30px}#overlay img{width:100%;max-width:1500px;display:block;margin:auto}#close{position:fixed;right:15px;top:10px;border:0;border-radius:50%;background:white;color:black;font-size:24px;width:38px;height:38px;cursor:pointer}.nav{display:block;text-align:center;margin:0 auto 18px;width:max-content;background:#e7f4f1;padding:9px 16px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:700}@media(max-width:500px){.panel{padding:15px}.issue{padding:9px;gap:9px}.meta b{font-size:15px}.meta small{font-size:12px}header{padding:32px 12px 38px}.thumb{width:42px;height:57px}.issue .month{min-width:56px}}
</style></head><body>
<header><div class="eyebrow">CHANGWON SUNGMIN GIRLS' HIGH SCHOOL</div><h1>성민소식지</h1><p>우리 학교의 오늘을 기록하다<br>2026년 3월 ~ 8월호</p></header>
<main><section class="panel" id="list"><div class="topbar"><h2>소식지 모아보기</h2><span class="minor">2026년 · 6개 호</span></div><a class="nav" href="index.html">↗ 선배 인터뷰 모아보기</a><div id="items"></div><p class="notice">※ 각 월호를 누르면 해당 소식지의 전체 지면이 차례대로 표시됩니다. 페이지를 눌러 확대할 수 있습니다.</p></section>
<section class="panel hidden" id="viewer"><button class="back" id="back">← 전체 소식지 목록</button><h2 id="title"></h2><div class="sub" id="info"></div><div class="pages" id="pages"></div><button class="back" id="bottomBack">← 목록으로 돌아가기</button></section><footer>창원성민여자고등학교 · 성민소식지</footer></main>
<div id="overlay" role="dialog" aria-label="소식지 지면 확대 보기"><button id="close" aria-label="닫기">×</button><img alt="확대된 소식지 지면" id="zoom"></div>
<script>const data=[{"month":3,"id":"03","images":["newsletter-pages/03-01.jpg","newsletter-pages/03-02.jpg","newsletter-pages/03-03.jpg","newsletter-pages/03-04.jpg","newsletter-pages/03-05.jpg"],"pages":5},{"month":4,"id":"04","images":["newsletter-pages/04-01.jpg","newsletter-pages/04-02.jpg","newsletter-pages/04-03.jpg","newsletter-pages/04-04.jpg","newsletter-pages/04-05.jpg","newsletter-pages/04-06.jpg","newsletter-pages/04-07.jpg","newsletter-pages/04-08.jpg"],"pages":8},{"month":5,"id":"05","images":["newsletter-pages/05-01.jpg","newsletter-pages/05-02.jpg","newsletter-pages/05-03.jpg","newsletter-pages/05-04.jpg","newsletter-pages/05-05.jpg","newsletter-pages/05-06.jpg","newsletter-pages/05-07.jpg","newsletter-pages/05-08.jpg","newsletter-pages/05-09.jpg"],"pages":9},{"month":6,"id":"06","images":["newsletter-pages/06-01.jpg","newsletter-pages/06-02.jpg","newsletter-pages/06-03.jpg","newsletter-pages/06-04.jpg","newsletter-pages/06-05.jpg","newsletter-pages/06-06.jpg"],"pages":6},{"month":7,"id":"07","images":["newsletter-pages/07-01.jpg","newsletter-pages/07-02.jpg","newsletter-pages/07-03.jpg","newsletter-pages/07-04.jpg","newsletter-pages/07-05.jpg","newsletter-pages/07-06.jpg","newsletter-pages/07-07.jpg"],"pages":7},{"month":8,"id":"08","images":["newsletter-pages/08-01.jpg","newsletter-pages/08-02.jpg","newsletter-pages/08-03.jpg","newsletter-pages/08-04.jpg","newsletter-pages/08-05.jpg","newsletter-pages/08-06.jpg"],"pages":6}];
const items=document.querySelector('#items'),list=document.querySelector('#list'),viewer=document.querySelector('#viewer');
for(const d of data){const b=document.createElement('button');b.className='issue';b.innerHTML=`<img class="thumb" src="${d.images[0]}" alt="${d.month}월호 표지" loading="lazy"><span class="month">${d.month}월호</span><span class="meta"><b>2026년 ${d.month}월 성민소식지</b><small>전체 ${d.pages}쪽 · 클릭하여 읽기</small></span><span class="arrow">›</span>`;b.onclick=()=>location.hash='issue-'+d.id;items.append(b)}
function route(){const match=location.hash.match(/^#issue-(\d\d)$/),d=match&&data.find(x=>x.id===match[1]);list.classList.toggle('hidden',!!d);viewer.classList.toggle('hidden',!d);if(d){document.querySelector('#title').textContent=`2026년 ${d.month}월호`;document.querySelector('#info').textContent=`성민소식지 · 전체 ${d.pages}쪽`;const box=document.querySelector('#pages');box.replaceChildren();d.images.forEach((src,j)=>{let figure=document.createElement('figure');figure.className='doc';let img=document.createElement('img');img.src=src;img.alt=`${d.month}월호 ${j+1}쪽`;img.loading=j<2?'eager':'lazy';img.onclick=()=>{document.querySelector('#zoom').src=src;document.querySelector('#overlay').style.display='block';document.body.style.overflow='hidden'};let cap=document.createElement('figcaption');cap.textContent=`${j+1} / ${d.pages}쪽 · 눌러 확대`;figure.append(img,cap);box.append(figure)})}window.scrollTo(0,0)}
window.addEventListener('hashchange',route);document.querySelector('#back').onclick=document.querySelector('#bottomBack').onclick=()=>{location.hash=''};function close(){document.querySelector('#overlay').style.display='none';document.body.style.overflow=''}document.querySelector('#close').onclick=close;document.querySelector('#overlay').onclick=e=>{if(e.target.id==='overlay')close()};window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});route();
</script></body></html>
