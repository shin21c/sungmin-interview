<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="창원성민여자고등학교 2026년 선배 인터뷰 모음"><title>성민 선배 인터뷰 | 창원성민여자고등학교</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#1f302d;background:#f4f7f6}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(135deg,#166c65,#2e9589);color:white;padding:38px 20px 42px;text-align:center}header .eyebrow{font-size:11px;letter-spacing:1.4px;opacity:.9}header h1{font-size:clamp(26px,5vw,38px);margin:12px 0 8px}header p{margin:0;opacity:.9;font-size:14px;line-height:1.6}main{max-width:850px;margin:-15px auto 60px;padding:0 16px}.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 30px #1a403017}h2{font-size:19px;margin:0 0 18px}.issue{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid #e1ece8;border-radius:14px;background:#fff;padding:16px;cursor:pointer;margin:10px 0;color:inherit;font:inherit}.issue:hover,.issue:focus-visible{border-color:#3caa9a;background:#f4fbf9}.issue .month{background:#e6f4ef;color:#136a5c;min-width:64px;padding:12px 9px;border-radius:12px;text-align:center;font-weight:750}.meta{flex:1;min-width:0}.meta b{display:block;font-size:17px;margin-bottom:5px}.meta small{display:block;color:#526a63;font-size:13px;line-height:1.5}.arrow{font-size:22px;color:#348d7f}.back{border:0;background:#e7f4f1;border-radius:11px;color:#17675e;padding:12px 16px;cursor:pointer;font-weight:700}.sub{color:#617570;font-size:13px;margin:6px 0 20px;line-height:1.7}.doc{margin:15px 0;box-shadow:0 5px 18px #00000013;border:1px solid #e6eeea;border-radius:8px;overflow:hidden;background:white}.doc img{display:block;width:100%;height:auto;cursor:zoom-in}.doc figcaption{padding:8px;text-align:center;font-size:12px;color:#5b716d;background:#f8faf9}.notice{font-size:12px;color:#5e716d;line-height:1.7;margin:22px 0}footer{text-align:center;font-size:12px;color:#788b85;padding:16px}.hidden{display:none}a{color:#176c60}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.minor{font-size:12px;color:#647d76}.pages{margin-top:12px}#viewer h2{margin-top:20px}#overlay{display:none;position:fixed;inset:0;z-index:10;background:#101715ec;overflow:auto;padding:45px 10px 30px}#overlay img{width:100%;max-width:1500px;display:block;margin:auto}#close{position:fixed;right:15px;top:10px;border:0;border-radius:50%;background:white;color:black;font-size:24px;width:38px;height:38px;cursor:pointer}@media(max-width:500px){.panel{padding:15px}.issue{padding:12px;gap:10px}.meta b{font-size:15px}.meta small{font-size:12px}header{padding:32px 12px 38px}}
</style></head><body>
<header><div class="eyebrow">CHANGWON SUNGMIN GIRLS' HIGH SCHOOL</div><h1>성민 선배 인터뷰</h1><p>선배들의 경험에서 나의 미래를 찾다<br>2026년 3월 ~ 8월호</p></header>
<main><section class="panel" id="list"><div class="topbar"><h2>인터뷰 모아보기</h2><span class="minor">3~8월 · 6개 호</span></div><div id="items"></div><p class="notice">※ 각 회차를 누르면 원본 소식지의 선배 인터뷰 지면이 열립니다. 4월호는 두 선배의 공동 인터뷰입니다.</p></section>
<section class="panel hidden" id="viewer"><button class="back" id="back">← 전체 인터뷰 목록</button><h2 id="title"></h2><div class="sub" id="info"></div><div class="pages" id="pages"></div><button class="back" id="bottomBack">← 목록으로 돌아가기</button></section>
<footer>창원성민여자고등학교 · 성민소식지 선배 인터뷰</footer></main><div id="overlay" role="dialog" aria-label="인터뷰 지면 확대 보기"><button id="close" aria-label="닫기">×</button><img alt="확대된 인터뷰 지면" id="zoom"></div>
<script>
const data=[{"id": "03", "month": 3, "name": "권아진", "uni": "건국대학교", "major": "KU자유전공학부", "images": ["pages/03-02.jpg", "pages/03-03.jpg", "pages/03-04.jpg", "pages/03-05.jpg"], "original_pages": "2~5쪽"}, {"id": "04", "month": 4, "name": "이성은 · 이가은", "uni": "서울대학교", "major": "간호학과", "images": ["pages/04-04.jpg", "pages/04-05.jpg", "pages/04-06.jpg", "pages/04-07.jpg"], "original_pages": "4~7쪽"}, {"id": "05", "month": 5, "name": "이정혜", "uni": "서강대학교", "major": "국어국문학과", "images": ["pages/05-04.jpg", "pages/05-05.jpg", "pages/05-06.jpg", "pages/05-07.jpg", "pages/05-08.jpg", "pages/05-09.jpg"], "original_pages": "4~9쪽"}, {"id": "06", "month": 6, "name": "김연우", "uni": "부산대학교", "major": "분자생물학과", "images": ["pages/06-03.jpg", "pages/06-04.jpg", "pages/06-05.jpg", "pages/06-06.jpg"], "original_pages": "3~6쪽"}, {"id": "07", "month": 7, "name": "김예진", "uni": "인제대학교", "major": "의예과", "images": ["pages/07-03.jpg", "pages/07-04.jpg", "pages/07-05.jpg", "pages/07-06.jpg", "pages/07-07.jpg"], "original_pages": "3~7쪽"}, {"id": "08", "month": 8, "name": "정은미", "uni": "단국대학교", "major": "경영학부", "images": ["pages/08-02.jpg", "pages/08-03.jpg", "pages/08-04.jpg", "pages/08-05.jpg", "pages/08-06.jpg"], "original_pages": "2~6쪽"}];
const items=document.querySelector('#items'),list=document.querySelector('#list'),viewer=document.querySelector('#viewer');
for(let i=0;i<data.length;i++){let d=data[i];let b=document.createElement('button');b.className='issue';b.innerHTML=`<span class="month">${d.month}월호</span><span class="meta"><b>${d.name} 선배</b><small>${d.uni} · ${d.major}</small></span><span class="arrow">›</span>`;b.addEventListener('click',()=>{location.hash='interview-'+d.id});items.append(b)}
function route(){let match=location.hash.match(/^#interview-(\d\d)$/),d=match&&data.find(x=>x.id===match[1]);list.classList.toggle('hidden',!!d);viewer.classList.toggle('hidden',!d);if(d){document.querySelector('#title').textContent=`${d.month}월호 | ${d.name} 선배`;document.querySelector('#info').textContent=`${d.uni} · ${d.major}  |  원본 소식지 ${d.original_pages}`;let box=document.querySelector('#pages');box.replaceChildren();d.images.forEach((src,j)=>{let figure=document.createElement('figure');figure.className='doc';let img=document.createElement('img');img.src=src;img.alt=`${d.month}월호 선배 인터뷰 ${j+1}쪽`;img.loading=j<2?'eager':'lazy';img.addEventListener('click',()=>{document.querySelector('#zoom').src=src;document.querySelector('#overlay').style.display='block';document.body.style.overflow='hidden'});let cap=document.createElement('figcaption');cap.textContent=`인터뷰 ${j+1} / ${d.images.length} · 눌러 확대`;figure.append(img,cap);box.append(figure)})}window.scrollTo(0,0)}
window.addEventListener('hashchange',route);document.querySelector('#back').onclick=document.querySelector('#bottomBack').onclick=()=>{location.hash=''};function close(){document.querySelector('#overlay').style.display='none';document.body.style.overflow=''}document.querySelector('#close').onclick=close;document.querySelector('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close()});window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});route();
</script></body></html>
